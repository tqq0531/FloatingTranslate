<h1>浮译 · Chrome 输入验收</h1>
<p>从系统输入法菜单手动选择浮译，仅输入虚构句子：依次打 <b>wo 空格、jintian 空格、qubeijing 空格</b>。应得到“我今天去北京”，并显示整句英文。拖选英文后右键复制，或点浮窗右侧的复制按钮。</p>
<label>普通文本框<textarea placeholder="在这里输入测试句"></textarea></label>
<label>聊天式编辑区<div contenteditable="true" role="textbox" aria-label="聊天式编辑区"></div></label>
<p>再试 Shift 切换英文、Command+L 进入地址栏、切换两个输入框。若不能输入，请从系统菜单手动选 ABC 恢复。</p>
<p>本页面没有 JavaScript、外部资源、请求或内容记录。不要输入真实密码或聊天记录。</p>
